[package]
name = "aether"
version = "0.1.0"
edition = "2021"
default-run = "aether_iced"

[[bin]]
name = "aether_iced"
path = "src/bin/aether_iced.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
hex = "0.4"
iced = { version = "0.13", features = ["tokio", "canvas"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }

[features]
default = ["ui"]
ui = ["iced"]
