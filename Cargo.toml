[package]
name = "aether"
version = "0.1.0"
edition = "2021"
description = "Aether is a privacy-first distributed structural invariant compression engine with source-bound algo token sharing and blindspot relay."
default-run = "aether_iced"

[[bin]]
name = "aether_iced"
path = "src/bin/aether_iced.rs"

[[bin]]
name = "aether_system"
path = "src/bin/aether_system.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
hex = "0.4"
iced = { version = "0.13", features = ["tokio", "canvas"], optional = true }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
aes-gcm = "0.10"
crc32fast = "1"
flate2 = "1"
zeroize = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.31", features = ["bundled"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
] }

[features]
default = ["ui"]
ui = ["iced"]
